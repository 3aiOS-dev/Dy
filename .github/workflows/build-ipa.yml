name: Jood IPA - Web App (Full Screen - Light Mode)

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.jood.ipa.app"
  NEW_APP_NAME:  "Jood IPA"
  TARGET_URL:    "https://ones-plus.neocities.org"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:

      - name: Build capacity check
        run: |
          df -h
          sysctl -n hw.ncpu
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          brew install ldid zip 2>/dev/null || true
          command -v zip || { echo "zip missing"; exit 1; }

      - name: Generate Info.plist
        run: |
          mkdir -p Resources
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>      <string>ar</string>
              <key>CFBundleAllowMixedLocalizations</key> <true/>
              <key>CFBundleExecutable</key>             <string>JoodApp</string>
              <key>CFBundleIdentifier</key>             <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key>  <string>6.0</string>
              <key>CFBundleName</key>                   <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundleDisplayName</key>            <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundlePackageType</key>            <string>APPL</string>
              <key>CFBundleSignature</key>              <string>????</string>
              <key>CFBundleShortVersionString</key>     <string>1.0</string>
              <key>CFBundleVersion</key>                <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>MinimumOSVersion</key>               <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key><string></string>
              </dict>
              <key>UIStatusBarHidden</key>              <false/>
              <key>UIStatusBarStyle</key>               <string>UIStatusBarStyleDarkContent</string>
              <key>UIViewControllerBasedStatusBarAppearance</key> <false/>
              <key>UIRequiresFullScreen</key>           <true/>
              <key>UIUserInterfaceStyle</key>           <string>Light</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key><true/>
                  <key>NSAllowsArbitraryLoadsInWebContent</key><true/>
              </dict>
              <key>NSCameraUsageDescription</key>
              <string>نحتاج الكاميرا لتشغيل ميزات الموقع.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>نحتاج مكتبة الصور لاختيار الملفات.</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>نحتاج حفظ الصور في مكتبتك.</string>
          </dict>
          </plist>
          PEOF
          plutil -lint Resources/Info.plist

      - name: Generate AppIcon
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          os.makedirs("Resources", exist_ok=True)

          def make(size):
              img = Image.new("RGB", (size, size), (245, 246, 250))
              d = ImageDraw.Draw(img)
              # خلفية فاتحة متدرجة
              for i in range(size):
                  t = i / max(1, size - 1)
                  r = int(245 - (60 * t))
                  g = int(246 - (60 * t))
                  b = int(252 - (60 * t))
                  d.line([(0, i), (size, i)], fill=(r, g, b))
              # مربع أبيض في المنتصف
              pad = size // 5
              d.rounded_rectangle((pad, pad, size - pad, size - pad),
                                  radius=size // 7, fill=(255, 255, 255))
              # حرف J بلون أزرق
              try:
                  from PIL import ImageFont
                  f = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", size // 3)
              except Exception:
                  f = None
              txt = "J"
              if f:
                  bbox = d.textbbox((0, 0), txt, font=f)
                  w = bbox[2] - bbox[0]; h = bbox[3] - bbox[1]
              else:
                  w, h = size // 6, size // 6
              d.text(((size - w) / 2, (size - h) / 2 - size // 30),
                     txt, fill=(45, 110, 220), font=f)
              return img

          sizes = {
              "AppIcon60x60@2x.png":           120,
              "AppIcon60x60@3x.png":           180,
              "AppIcon76x76@2x~ipad.png":      152,
              "AppIcon83.5x83.5@2x~ipad.png":  167,
              "AppIcon1024x1024.png":          1024,
          }
          for name, s in sizes.items():
              make(s).save(f"Resources/{name}", "PNG")
          print("icons done")
          PYEOF
          ls -lh Resources

      - name: Generate source - JoodApp.swift
        run: |
          cat > JoodApp.swift << 'SWEOF'
          import SwiftUI
          import WebKit
          import UIKit

          // ============================================================
          // Jood IPA — تطبيق أصلي يعرض الموقع بكامل الشاشة بدون أي واجهة
          // متصفح. الوضع الفاتح فقط (لا وضع داكن نهائيًا).
          // ============================================================

          @main
          struct JoodApp: App {
              init() {
                  // فرض الوضع الفاتح على كل النوافذ
                  if let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene {
                      scene.windows.forEach { $0.overrideUserInterfaceStyle = .light }
                  }
                  UINavigationBar.appearance().isHidden = true
              }

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .preferredColorScheme(.light)
                          .ignoresSafeArea(.all, edges: .all)
                  }
              }
          }

          // ============================================================
          // RootView — يستدعي طبقة WKWebView فقط
          // ============================================================
          struct RootView: View {
              var body: some View {
                  WebViewRepresentable()
                      .ignoresSafeArea(.all, edges: .all)
                      .background(Color.white)
                      .preferredColorScheme(.light)
              }
          }

          // ============================================================
          // WKWebView — يعرض الموقع بكامل الشاشة
          // ============================================================
          struct WebViewRepresentable: UIViewRepresentable {

              private static let initialURL = URL(string: "https://ones-plus.neocities.org")!

              func makeUIView(context: Context) -> UIView {
                  let container = UIView(frame: .zero)
                  container.backgroundColor = .white
                  container.overrideUserInterfaceStyle = .light

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  config.websiteDataStore = .default()

                  let userScript = WKUserScript(
                      source: """
                      document.documentElement.style.background = '#ffffff';
                      document.body && (document.body.style.background = '#ffffff');
                      document.documentElement.style.webkitTouchCallout = 'none';
                      """,
                      injectionTime: .atDocumentEnd,
                      forMainFrameOnly: false
                  )
                  config.userContentController.addUserScript(userScript)

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.overrideUserInterfaceStyle = .light
                  webView.isOpaque = true
                  webView.backgroundColor = .white
                  webView.scrollView.backgroundColor = .white
                  webView.scrollView.bounces = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.showsVerticalScrollIndicator = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.allowsBackForwardNavigationGestures = false
                  webView.allowsLinkPreview = false
                  webView.navigationDelegate = context.coordinator
                  webView.uiDelegate = context.coordinator
                  if #available(iOS 16.4, *) {
                      webView.isInspectable = false
                  }

                  container.addSubview(webView)

                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: container.topAnchor),
                      webView.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: container.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: container.trailingAnchor)
                  ])

                  context.coordinator.webView = webView

                  var req = URLRequest(url: Self.initialURL)
                  req.cachePolicy = .reloadRevalidatingCacheData
                  req.timeoutInterval = 30
                  webView.load(req)

                  return container
              }

              func updateUIView(_ uiView: UIView, context: Context) {}

              func makeCoordinator() -> Coordinator {
                  Coordinator()
              }

              // ============================================================
              // Coordinator — يتعامل مع التنقل، الروابط الخارجية، والملفات
              // ============================================================
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                  weak var webView: WKWebView?

                  func webView(_ webView: WKWebView,
                               decidePolicyFor navigationAction: WKNavigationAction,
                               decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {

                      guard let url = navigationAction.request.url else {
                          decisionHandler(.allow); return
                      }

                      let scheme = url.scheme?.lowercased() ?? ""
                      let systemSchemes = [
                          "mailto", "tel", "sms",
                          "itms-services", "itms-apps",
                          "whatsapp", "tg", "telegram",
                          "instagram", "twitter", "x",
                          "youtube", "maps", "facetime",
                          "shortcuts", "files", "photos-redirect"
                      ]
                      if systemSchemes.contains(scheme) {
                          UIApplication.shared.open(url, options: [:], completionHandler: nil)
                          decisionHandler(.cancel)
                          return
                      }

                      if scheme.isEmpty || scheme == "about" {
                          decisionHandler(.allow); return
                      }

                      if scheme == "http" || scheme == "https" {
                          decisionHandler(.allow); return
                      }

                      UIApplication.shared.open(url, options: [:], completionHandler: nil)
                      decisionHandler(.cancel)
                  }

                  func webView(_ webView: WKWebView,
                               decidePolicyFor navigationResponse: WKNavigationResponse,
                               decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {

                      if let http = navigationResponse.response as? HTTPURLResponse {
                          let mime = (http.value(forHTTPHeaderField: "Content-Type") ?? "").lowercased()
                          let url = http.url
                          let ext = url?.pathExtension.lowercased() ?? ""

                          if ext == "ipa" || ext == "plist" || ext == "mobileprovision" || ext == "apk" ||
                             mime.contains("application/octet-stream") ||
                             mime.contains("application/x-plist") ||
                             mime.contains("application/xml") ||
                             mime.contains("application/vnd.android") {
                              if let url = url {
                                  UIApplication.shared.open(url, options: [:], completionHandler: nil)
                              }
                              decisionHandler(.cancel)
                              return
                          }
                      }

                      decisionHandler(.allow)
                  }

                  func webView(_ webView: WKWebView,
                               didFailProvisionalNavigation navigation: WKNavigation!,
                               withError error: Error) {
                      let ns = error as NSError
                      if ns.code == NSURLErrorCancelled { return }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2.0) {
                          webView.reload()
                      }
                  }

                  func webView(_ webView: WKWebView,
                               didFail navigation: WKNavigation!,
                               withError error: Error) {
                      let ns = error as NSError
                      if ns.code == NSURLErrorCancelled { return }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2.0) {
                          webView.reload()
                      }
                  }

                  // ============ WKUIDelegate ============
                  func webView(_ webView: WKWebView,
                               createWebViewWith configuration: WKWebViewConfiguration,
                               for navigationAction: WKNavigationAction,
                               windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if navigationAction.targetFrame == nil,
                         let url = navigationAction.request.url {
                          webView.load(URLRequest(url: url))
                      }
                      return nil
                  }

                  func webView(_ webView: WKWebView,
                               runJavaScriptAlertPanelWithMessage message: String,
                               initiatedByFrame frame: WKFrameInfo,
                               completionHandler: @escaping () -> Void) {
                      let alert = UIAlertController(title: nil, message: message,
                                                    preferredStyle: .alert)
                      alert.overrideUserInterfaceStyle = .light
                      alert.addAction(UIAlertAction(title: "حسنًا", style: .default) { _ in
                          completionHandler()
                      })
                      topViewController()?.present(alert, animated: true)
                  }

                  func webView(_ webView: WKWebView,
                               runJavaScriptConfirmPanelWithMessage message: String,
                               initiatedByFrame frame: WKFrameInfo,
                               completionHandler: @escaping (Bool) -> Void) {
                      let alert = UIAlertController(title: nil, message: message,
                                                    preferredStyle: .alert)
                      alert.overrideUserInterfaceStyle = .light
                      alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel) { _ in
                          completionHandler(false)
                      })
                      alert.addAction(UIAlertAction(title: "موافق", style: .default) { _ in
                          completionHandler(true)
                      })
                      topViewController()?.present(alert, animated: true)
                  }

                  func webView(_ webView: WKWebView,
                               runJavaScriptTextInputPanelWithPrompt prompt: String,
                               defaultText: String?,
                               initiatedByFrame frame: WKFrameInfo,
                               completionHandler: @escaping (String?) -> Void) {
                      let alert = UIAlertController(title: nil, message: prompt,
                                                    preferredStyle: .alert)
                      alert.overrideUserInterfaceStyle = .light
                      alert.addTextField { $0.text = defaultText }
                      alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel) { _ in
                          completionHandler(nil)
                      })
                      alert.addAction(UIAlertAction(title: "حسنًا", style: .default) { _ in
                          completionHandler(alert.textFields?.first?.text)
                      })
                      topViewController()?.present(alert, animated: true)
                  }

                  private func topViewController() -> UIViewController? {
                      guard let scene = UIApplication.shared.connectedScenes
                          .first(where: { $0.activationState == .foregroundActive }) as? UIWindowScene,
                            let window = scene.windows.first(where: { $0.isKeyWindow })
                      else { return nil }
                      var top = window.rootViewController
                      while let presented = top?.presentedViewController {
                          top = presented
                      }
                      return top
                  }
              }
          }
          SWEOF
          wc -l JoodApp.swift

      - name: Compile Swift sources
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            JoodApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios14.0 \
            -O \
            -module-name JoodApp \
            -parse-as-library \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework WebKit \
            -o JoodApp
          file JoodApp
          ls -lh JoodApp

      - name: Build .app bundle
        run: |
          set -euo pipefail
          rm -rf build-output
          APP_DIR="build-output/Payload/JoodApp.app"
          mkdir -p "$APP_DIR"
          cp JoodApp "$APP_DIR/JoodApp"
          cp Resources/Info.plist "$APP_DIR/Info.plist"
          chmod +x "$APP_DIR/JoodApp"

          cp Resources/AppIcon*.png "$APP_DIR/" 2>/dev/null || true

          xattr -cr build-output || true
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

      - name: Sign IPA (if secrets present)
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          APP_DIR="build-output/Payload/JoodApp.app"

          if [ -z "${IOS_P12_BASE64:-}" ] || \
             [ -z "${IOS_P12_PASSWORD:-}" ] || \
             [ -z "${IOS_MOBILEPROVISION_BASE64:-}" ]; then
            echo "::warning::Signing secrets not configured — producing unsigned IPA."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/jood.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#${PROFILE_TEAM}.}"

          if [ "$PROFILE_BUNDLE_ID" != "$NEW_BUNDLE_ID" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "::error::Profile bundle id '$PROFILE_BUNDLE_ID' != '$NEW_BUNDLE_ID'."
            exit 1
          fi

          cp "$PROFILE_PATH" "$APP_DIR/embedded.mobileprovision"

          /usr/libexec/PlistBuddy -x -c 'Print Entitlements' "$RUNNER_TEMP/profile.plist" \
            > "$RUNNER_TEMP/entitlements.plist"

          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F\" '/Apple Development|Apple Distribution|iPhone Distribution|iPhone Developer/{print $2; exit}')

          if [ -z "$SIGN_ID" ]; then
            echo "::error::No valid signing identity found in IOS_P12_BASE64."
            exit 1
          fi

          /usr/bin/codesign --force --sign "$SIGN_ID" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp=none "$APP_DIR"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -f artifacts/JoodApp.ipa

          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete
          xattr -cr build-output/Payload || true

          ( cd build-output && \
            zip -r -X -q -fz- -Z deflate ../artifacts/JoodApp.ipa Payload )

          ls -lh artifacts/JoodApp.ipa

          echo "== Verify =="
          unzip -tq artifacts/JoodApp.ipa >/dev/null
          unzip -l artifacts/JoodApp.ipa | grep "Payload/JoodApp.app/JoodApp"
          echo "IPA OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoodApp-IPA
          path: artifacts/JoodApp.ipa
          compression-level: 0
          retention-days: 90
